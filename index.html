<head>

<meta name="mobile-web-app-capable" content="yes">

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<title>Forja Entrenos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<script src="vendor/supabase.js"></script>
<style>
/* Layout: app de una columna (máx. 560px), cabecera fija arriba y barra de pestañas abajo, como una app nativa de iPhone. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#E2E6EB; --ink:#14181D; --muted:#58626E; --line:#D2D7DE;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FBE4D7;
  --ok:#2B8A3E; --ok-soft:#DCF1E0; --danger:#C92A2A; --shadow:0 1px 2px rgba(20,24,29,.08),0 6px 18px rgba(20,24,29,.06);
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#171B20; --surface-2:#222831; --ink:#ECEFF3; --muted:#9AA4B0; --line:#2B323B;
  --accent:#FF7A3D; --accent-ink:#1B0C04; --accent-soft:#3A2217;
  --ok:#5BD172; --ok-soft:#183020; --danger:#FF6B6B; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#171B20; --surface-2:#222831; --ink:#ECEFF3; --muted:#9AA4B0; --line:#2B323B;
  --accent:#FF7A3D; --accent-ink:#1B0C04; --accent-soft:#3A2217;
  --ok:#5BD172; --ok-soft:#183020; --danger:#FF6B6B; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.brand svg{width:30px;height:30px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:19px;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* Pasos */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:6px 18px}
.step{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left}
.step .bar{height:5px;border-radius:3px;background:var(--surface-2)}
.step.on .bar,.step.done .bar{background:var(--accent)}
.step .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.step.on .lbl{color:var(--ink)}
.step .lbl b{font-family:var(--f-display);font-size:15px;margin-right:4px}

/* Rejilla de equipo */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:108px}
.tile svg{width:64px;height:40px;color:var(--muted)}
.tile .t{font-weight:600;font-size:15px}
.tile .c{font-size:12px;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"] svg{color:var(--accent)}
.tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.tile[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:12px;height:12px}

/* Chips músculos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip:disabled{opacity:.4}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.pri{background:var(--accent-soft);color:var(--accent)}

/* Lista de ejercicios */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:600}
.item .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ord{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);width:22px;text-align:center}
.mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.mini svg{width:18px;height:18px}
.group-h{padding:10px 14px;background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Botones */
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prog{display:flex;flex-direction:column;gap:12px}
.prog .meta{display:flex;gap:6px;flex-wrap:wrap}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.day .grow{min-width:0}
.day small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Banner sesión activa */
.live{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.live button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:8px 12px;font-weight:700}

/* Sesión */
.sess-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:4px 12px}
.clock{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.pager button{flex:none;min-width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:17px}
.pager button.cur{border-color:var(--accent);color:var(--accent)}
.pager button.full{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.exname{font-size:30px}
.tip{font-size:14px;color:var(--muted);margin-top:6px}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:8px}
.sets th{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 4px}
.sets td{text-align:center;padding:0 3px}
.sets td:first-child{font-family:var(--f-display);font-weight:700;font-size:20px;width:34px}
.sets .prev{font-size:13px;color:var(--muted);white-space:nowrap}
.sets input{width:100%;max-width:84px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--muted);opacity:.6}
.sets tr.done input{background:var(--ok-soft);border-color:transparent}
.check{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{width:20px;height:20px}
tr.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest .in{max-width:560px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.rest .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 35%,transparent);transition:width .25s linear}
.rest .in>*{position:relative}
.rest .t{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:72px}
.rest button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;background:color-mix(in srgb,var(--bg) 18%,transparent);color:inherit}

/* Estadísticas */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.chart svg{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:28px 18px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty svg{width:48px;height:48px;color:var(--muted)}

/* Herramientas */
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,textarea{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px;font-variant-numeric:tabular-nums;width:100%}
textarea{height:90px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.big{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ptable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ptable td{padding:6px 0;border-top:1px solid var(--line)}
.ptable td:last-child{text-align:right;font-weight:600}
.plates{display:flex;align-items:center;gap:3px;min-height:90px;overflow-x:auto}
.plates .barend{width:46px;height:10px;background:var(--muted);border-radius:2px}
.plates .p{border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;writing-mode:vertical-rl}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Hoja y modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:86%;display:flex;flex-direction:column;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .scroll{overflow-y:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
.dialog{align-items:center;padding:16px}
.dialog .box{background:var(--surface);border-radius:16px;padding:20px;max-width:360px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:90%}
/* Demostraciones animadas */
.demo{position:relative;width:100%;max-width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#FFFFFF;border:1px solid var(--line)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img+img{opacity:0;animation:flip 2.2s ease-in-out infinite}
@keyframes flip{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.demo.none{display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.demo.none svg{width:40%;height:40%}
.demo.thumb{width:64px;flex:none;border-radius:9px}
.demo.thumb.none svg{width:70%}
.thumbbtn{border:0;padding:0;background:none;flex:none;border-radius:9px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.strip .demo.thumb{width:56px}
.yt{text-decoration:none;color:var(--ink);padding:11px 14px;font-size:15px}
.yt svg{width:22px;height:22px}
.search{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%;font-size:16px}
/* Calendario y plan */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal-d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums;border:0;background:none;color:var(--muted)}
button.cal-d.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
button.cal-d.on.today{box-shadow:inset 0 0 0 2px var(--ink),0 0 0 2px var(--accent)}
.pd-num{width:52px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:16px;font-weight:600}
.mini:disabled{opacity:.35}
/* Cuentas y amigos */
.auth{max-width:420px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:16px}
.auth .brand{font-size:34px}
.auth .brand svg{width:44px;height:44px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:15px;text-align:left}
.err{color:var(--danger);font-weight:600;font-size:14px;margin:0}
.err:empty{display:none}
.ok-msg{color:var(--ok);font-weight:600;font-size:14px;margin:0}
.code-input{font-size:28px!important;letter-spacing:.4em;text-align:center;font-weight:700}
.check-row{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.35}
.check-row input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;border:0;flex:none;text-transform:uppercase}
.avatar.lg{width:64px;height:64px;font-size:26px}
.avatar.alt{background:var(--surface-2);color:var(--ink)}
.top .right{display:flex;gap:8px;align-items:center}
.tabs .in{grid-template-columns:repeat(5,1fr)!important}
.tabs button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.pill.okp{background:var(--ok-soft);color:var(--ok)}
.notice{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.sm{padding:8px 12px!important;font-size:14px!important}
.admin-row .meta{font-size:13px;color:var(--muted);word-break:break-word}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.demo img+img{animation-duration:4s}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
/* ---------- Iconos ---------- */
const I={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>',

const S=Object.assign({
  settings:{rest:90,theme:null},
  history:[],active:null,
  wiz:{step:1,equip:['bw','dumbbell'],muscles:[],list:[],sig:''}
},load()||{});
let view=S.active?'session':'train';
let summaryId=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyTheme(){if(S.settings.theme)document.documentElement.setAttribute('data-theme',S.settings.theme);else document.documentElement.removeAttribute('data-theme')}
applyTheme();

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtTime=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fmtNum=n=>Math.round(n).toLocaleString('es-ES');
const fmtDate=t=>new Date(t).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function canDo(ex,eqSet){return ex.eq.every(r=>r.split('|').some(e=>eqSet.has(e)))}
function eqLabel(ex){return ex.eq.map(r=>r.split('|').map(e=>EQUIP.find(q=>q.id===e).name).join(' o ')).join(' + ')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i==2?1180:880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200]);native({haptic:true})}
/* Puente con la app nativa de iPhone (no hace nada en la web) */
function native(msg){try{window.webkit?.messageHandlers?.forja?.postMessage(msg)}catch(e){}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
let wake=null;
async function keepAwake(on){native({awake:!!on});try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){wake.release();wake=null}}catch(e){}}
/* Demostración: dos fotos (inicio y fin) que se alternan como un GIF */
function demo(id,cls=''){
  const f=IMG[id],e=EXI[id];
  if(!f)return `<div class="demo none ${cls}" aria-label="Sin foto para ${esc(e.name)}">${EQ_SVG[e.eq[0].split('|')[0]]}</div>`;
  return `<div class="demo ${cls}" role="img" aria-label="Demostración de ${esc(e.name)}"><img src="img/${f}/0.jpg" alt="" loading="lazy" decoding="async"><img src="img/${f}/1.jpg" alt="" loading="lazy" decoding="async"></div>`;
}
const ytUrl=id=>'https://www.youtube.com/results?search_query='+encodeURIComponent('cómo hacer '+EXI[id].name+' técnica correcta');
const ytBtn=(id,extra='')=>`<a class="btn ghost yt" href="${ytUrl(id)}" target="_blank" rel="noopener" ${extra}>${I.play} Ver vídeo en YouTube</a>`;
function infoSheet(id){
  const e=EXI[id];
  $('#layer').innerHTML=`<div class="overlay" data-a="close-layer"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(e.name)}">
    <div class="row between"><h2>${e.name}</h2><button class="mini" data-a="close-layer" aria-label="Cerrar">${I.x}</button></div>
    <div class="scroll stack">${demo(id)}
      <div class="row wrap" style="gap:6px">${e.mus.map((m,i)=>`<span class="tag ${i?'':'pri'}">${MNAME[m]}</span>`).join('')}<span class="tag">${eqLabel(e)}</span>${e.kind==='time'?'<span class="tag">Por tiempo</span>':''}</div>
      <p style="margin:0">${e.tip}</p>${ytBtn(id)}${exHist(id).length?`<button class="btn ghost block" data-a="prog-ex" data-v="${id}">${I.stats} Ver mi progreso</button>`:''}</div></div></div>`;
}
function lastPerf(exId){for(let i=S.history.length-1;i>=0;i--){const e=S.history[i].exercises.find(x=>x.exId===exId);if(e&&e.sets.length)return e.sets}return null}

/* ---------- Modal / hoja ---------- */
function closeLayer(){$('#layer').innerHTML=''}
function confirmBox(title,text,okLabel,onOk,danger=true){
  $('#layer').innerHTML=`<div class="overlay dialog" data-a="close-layer"><div class="box stack" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p>
    <div class="actions" style="margin-top:6px"><button class="btn ghost" data-a="close-layer">Cancelar</button><button class="btn ${danger?'danger':'primary'}" id="okbtn">${esc(okLabel)}</button></div></div></div>`;
  $('#okbtn').onclick=()=>{closeLayer();onOk()};
}

/* ---------- Render principal ---------- */
function render(){
  const app=$('#app');
  const gate=authGate();
  document.querySelector('.tabs').hidden=gate!==null;
  if(gate!==null){app.innerHTML=gate;return}
  const top=`<header class="top"><div class="brand">${I.logo}Forja</div>
    <div class="right"><button class="iconbtn" data-a="theme" aria-label="Cambiar tema claro/oscuro">${isDark()?I.sun:I.moon}</button>
    <button class="avatar" data-a="tab" data-v="me" aria-label="Mi perfil">${esc(initials(A.profile))}</button></div></header>`;
  let body='';
  if(view==='session'&&S.active)body=vSession();
  else if(view==='summary')body=vSummary();
  else{
    if(view==='session')view='train';
    const live=S.active?`<div class="live"><div class="row"><span class="dot"></span><div><b>Entreno en curso</b><div style="font-size:13px;opacity:.75"><span data-elapsed></span> · ${esc(S.active.name)}</div></div></div><button data-a="resume">Continuar</button></div>`:'';
    body=live+(({train:vTrain,programs:vPrograms,stats:vStats,tools:vTools,friends:vFriends,friend:vFriend,me:vMe,admin:vAdmin,dayedit:vDayEdit})[view]||vTrain)();
  }
  app.innerHTML=top+body+restBar();
  renderTabs();
  tick();
}
function isDark(){return S.settings.theme?S.settings.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function renderTabs(){
  const cur=view==='session'||view==='summary'?'train':view==='friend'?'friends':view==='admin'?'me':view==='dayedit'?'programs':view;
  const nb=socialBadge();
  $('#tabs').innerHTML=[['train','Entrenar',I.train],['programs','Programas',I.prog],['friends','Amigos',I.friends],['stats','Estadísticas',I.stats],['tools','Herramientas',I.tools]]
   .map(([id,l,ic])=>`<button data-a="tab" data-v="${id}" ${cur===id?'aria-current="page"':''}>${ic}${l}${id==='friends'&&nb?`<span class="badge">${nb}</span>`:''}</button>`).join('');
}

  const steps=[['Equipo','Selecciona tu equipo'],['Músculos','Elige qué entrenar'],['Ejercicios','Ajusta tu sesión']];
  const head=`<div class="steps">${steps.map((s,i)=>`<button class="step ${w.step===i+1?'on':''} ${w.step>i+1?'done':''}" data-a="goto-step" data-v="${i+1}" ${i+1>maxStep()?'disabled':''}><span class="bar"></span><span class="lbl"><b>${i+1}</b>${s[0]}</span></button>`).join('')}</div>`;
  let inner='';
  const eqSet=new Set(w.equip);
  if(w.step===1){
    inner=`<div class="stack"><div><h1>¿Con qué entrenas hoy?</h1><p class="muted" style="margin:6px 0 0">Marca todo el equipo que tengas a mano. Solo verás ejercicios que puedas hacer.</p></div>
    <div class="grid">${EQUIP.map(e=>{const on=w.equip.includes(e.id);return `<button class="tile" aria-pressed="${on}" data-a="eq" data-v="${e.id}"><span class="tick">${on?I.check:''}</span>${EQ_SVG[e.id]}<span class="t">${e.name}</span></button>`}).join('')}</div>
    <p class="muted num" style="margin:0;font-size:14px">${EX.filter(e=>canDo(e,eqSet)).length} ejercicios disponibles con tu selección.</p></div>
    <div class="actions"><button class="btn primary" data-a="next" ${w.equip.length?'':'disabled'}>Continuar ${I.right}</button></div>`;
  }else if(w.step===2){
    inner=`<div class="stack"><div><h1>¿Qué quieres trabajar?</h1><p class="muted" style="margin:6px 0 0">Elige uno o varios grupos musculares. El número indica cuántos ejercicios tienes disponibles con tu equipo; en el siguiente paso eliges cuántos usar.</p></div>
    <div class="chips">${MUSCLES.map(m=>{const n=EX.filter(e=>canDo(e,eqSet)&&e.mus.includes(m.id)).length;const on=w.muscles.includes(m.id);return `<button class="chip" aria-pressed="${on}" data-a="mu" data-v="${m.id}" ${n?'':'disabled'}>${m.name}<small>${n}</small></button>`}).join('')}</div>
    <div class="row wrap"><button class="btn ghost" data-a="mu-preset" data-v="pecho,triceps,hombros" style="padding:9px 12px;font-size:14px">Empuje</button><button class="btn ghost" data-a="mu-preset" data-v="espalda,biceps,trapecio" style="padding:9px 12px;font-size:14px">Tirón</button><button class="btn ghost" data-a="mu-preset" data-v="cuadriceps,isquios,gluteos,gemelos" style="padding:9px 12px;font-size:14px">Pierna</button><button class="btn ghost" data-a="mu-preset" data-v="pecho,espalda,hombros,cuadriceps,isquios,abdominales" style="padding:9px 12px;font-size:14px">Cuerpo completo</button></div></div>
    <div class="actions"><button class="btn ghost" data-a="prev">${I.left} Anterior</button><button class="btn primary" data-a="next" ${w.muscles.length?'':'disabled'}>Continuar ${I.right}</button></div>`;
  }else{
    ensureList();
    const byM={};w.list.forEach(id=>{const m=pickGroup(id);(byM[m]=byM[m]||[]).push(id)});
    let n=0;
    inner=`<div class="stack"><div><h1>Tu sesión</h1><p class="muted" style="margin:6px 0 0">Toca una foto para ver el ejercicio y su vídeo. Cambia ${I.swap.replace('<svg','<svg style="width:15px;height:15px;vertical-align:-2px"')} o quita ejercicios hasta que te guste. Se generan 3 series por ejercicio.</p></div>
    <div class="field"><label>Ejercicios por músculo</label><div class="seg">${[[2,'2'],[3,'3'],[4,'4'],[5,'5'],[0,'Todos']].map(([v,l])=>`<button data-a="per" data-v="${v}" aria-pressed="${(w.per??3)===v}">${l}</button>`).join('')}</div></div>
    ${w.list.length?`<div class="list">${Object.keys(byM).map(m=>`<div class="group-h row between"><span>${MNAME[m]} · ${byM[m].length} de ${availFor(m).length}</span><button class="btn ghost" style="padding:4px 10px;font-size:12px;letter-spacing:.04em" data-a="add-sheet" data-v="${m}">${I.plus.replace('<svg','<svg style="width:14px;height:14px"')} Añadir</button></div>`+byM[m].map(id=>{const e=EXI[id];n++;return `<div class="item"><button class="thumbbtn" data-a="info" data-v="${id}" aria-label="Ver cómo se hace ${e.name}">${demo(id,'thumb')}</button><div class="grow"><div class="name"><span class="muted num">${n}.</span> ${e.name}</div><div class="sub"><span class="tag">${eqLabel(e)}</span>${e.kind==='time'?'<span class="tag">Tiempo</span>':''}</div></div>
      <button class="mini" data-a="swap" data-v="${id}" aria-label="Cambiar ${e.name}">${I.swap}</button><button class="mini" data-a="rm" data-v="${id}" aria-label="Quitar ${e.name}">${I.x}</button></div>`}).join('')).join('')}</div>`
    :`<div class="empty"><p style="margin:0">No queda ningún ejercicio. Añade uno o vuelve a generar la lista.</p></div>`}
    <div class="row"><button class="btn ghost" data-a="add-sheet" style="flex:1">${I.plus} Añadir</button><button class="btn ghost" data-a="regen" style="flex:1">${I.swap} Regenerar</button></div></div>
    <div class="actions"><button class="btn ghost" data-a="prev">${I.left}</button><button class="btn primary" data-a="start-custom" ${w.list.length?'':'disabled'} style="flex:4">Empezar · ${w.list.length} ejercicios</button></div>`;
  }
  return todayCard()+head+inner;
}
function availFor(m){const es=new Set(S.wiz.equip);return EX.filter(e=>canDo(e,es)&&e.mus.includes(m))}
function maxStep(){const w=S.wiz;return !w.equip.length?1:!w.muscles.length?2:3}
function pickGroup(id){const e=EXI[id];return S.wiz.muscles.find(m=>e.mus[0]===m)||S.wiz.muscles.find(m=>e.mus.includes(m))||e.mus[0]}
function ensureList(){
  const w=S.wiz,sig=w.equip.slice().sort()+'|'+w.muscles.slice().sort()+'|'+(w.per??3);
  if(w.sig===sig)return;w.sig=sig;genList();
}
function genList(){
  const w=S.wiz,eqSet=new Set(w.equip),used=new Set();w.list=[];
  const per=(w.per??3)||Infinity;
  w.muscles.forEach(m=>{
    const prim=shuffle(EX.filter(e=>canDo(e,eqSet)&&e.mus[0]===m&&!used.has(e.id)));
    const sec=shuffle(EX.filter(e=>canDo(e,eqSet)&&e.mus.includes(m)&&e.mus[0]!==m&&!used.has(e.id)));
    [...prim,...sec].slice(0,per).forEach(e=>{used.add(e.id);w.list.push(e.id)});
  });
  save();
}

/* ---------- Sesión ---------- */
function startSession(name,items){
  const go=()=>{
    S.active={id:uid(),name,start:Date.now(),idx:0,rest:null,exercises:items.map(it=>({exId:it.exId,target:it.target||null,sets:Array.from({length:it.sets||3},()=>({kg:'',reps:'',done:false}))}))};
    save();view='session';unlockAudio();keepAwake(true);render();window.scrollTo(0,0);
  };
  if(S.active)confirmBox('Ya hay un entreno en curso','Si empiezas otro, el actual se descarta sin guardar.','Descartar y empezar',go);else go();
}
function vSession(){
  const s=S.active,cur=s.exercises[s.idx],ex=EXI[cur.exId],prev=lastPerf(cur.exId)||[];
  const isT=ex.kind==='time';
  const pager=s.exercises.map((e,i)=>{const full=e.sets.length&&e.sets.every(x=>x.done);return `<button class="${i===s.idx?'cur':''} ${full?'full':''}" data-a="goto-ex" data-v="${i}" aria-label="Ejercicio ${i+1}: ${EXI[e.exId].name}">${i+1}</button>`}).join('');
  const rows=cur.sets.map((st,i)=>{const p=prev[i];const ph=p?{kg:p.kg||'',reps:p.reps||''}:{kg:'',reps:cur.target||''};

    <td><input inputmode="decimal" aria-label="Kilos serie ${i+1}" id="kg-${s.idx}-${i}" data-set="${i}" data-f="kg" value="${esc(st.kg)}" placeholder="${esc(ph.kg||'0')}"></td>
    <td><input inputmode="numeric" aria-label="${isT?'Segundos':'Repeticiones'} serie ${i+1}" id="rp-${s.idx}-${i}" data-set="${i}" data-f="reps" value="${esc(st.reps)}" placeholder="${esc(ph.reps||(isT?'30':'10'))}"></td>
    <td><button class="check" data-a="done" data-v="${i}" aria-label="Completar serie ${i+1}" aria-pressed="${st.done}">${I.check}</button></td></tr>`}).join('');

  return `<div class="sess-head"><div><div class="eyebrow">${esc(s.name)}</div><div class="clock" data-elapsed>0:00</div></div>
    <div class="row"><button class="btn ghost" data-a="leave" style="padding:10px 12px;font-size:14px">Salir</button><button class="btn primary" data-a="finish" style="padding:10px 14px;font-size:14px">${I.flag} Terminar</button></div></div>
  <div class="pager">${pager}</div>
  <div class="card">${demo(cur.exId)}<div class="eyebrow num" style="margin-top:12px">Ejercicio ${s.idx+1} de ${s.exercises.length} · ${doneSets} series hechas</div>
    <h2 class="exname" style="margin-top:4px">${ex.name}</h2>
    <div class="row wrap" style="gap:6px;margin-top:8px">${ex.mus.map((m,i)=>`<span class="tag ${i?'':'pri'}">${MNAME[m]}</span>`).join('')}<span class="tag">${eqLabel(ex)}</span></div>
    <p class="tip">${ex.tip}${cur.target?` <b style="color:var(--ink)">Objetivo: ${cur.target}${isT?' s':' reps'}.</b>`:''}</p>
    ${(()=>{const lh=exHist(cur.exId),l=lh[lh.length-1];return l?`<div class="notice" style="margin-top:10px;font-size:14px"><b>Última vez</b> (${relDay(l.date)}): ${l.sets.map(x=>setTxt(x,isT)).join(' · ')}</div>`:''})()}
    <div class="row" style="margin-top:10px"><button class="btn ghost" style="flex:1;padding:11px 10px;font-size:15px" data-a="prog-ex" data-v="${cur.exId}">${I.stats} Mi progreso</button>${ytBtn(cur.exId,'style="flex:1;padding:11px 10px"').replace('Ver vídeo en YouTube','Vídeo')}</div>
    <table class="sets"><thead><tr><th>Serie</th><th>Anterior</th><th>kg</th><th>${isT?'Seg':'Reps'}</th><th><span style="position:absolute;left:-9999px">Hecha</span></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-a="add-set" style="flex:1;padding:10px">${I.plus} Serie</button><button class="btn ghost" data-a="rm-set" style="flex:1;padding:10px" ${cur.sets.length>1?'':'disabled'}>${I.minus} Serie</button></div>
  </div>
  <div class="actions"><button class="btn ghost" data-a="ex-prev" ${s.idx?'':'disabled'}>${I.left} Anterior</button><button class="btn ${s.idx<s.exercises.length-1?'primary':'ghost'}" data-a="ex-next" ${s.idx<s.exercises.length-1?'':'disabled'}>Siguiente ${I.right}</button></div>

function restBar(){
  const r=S.active&&S.active.rest;if(!r||view!=='session')return '';
  return `<div class="rest" aria-live="polite"><div class="in"><span class="fill" data-rest-fill></span><span class="t" data-rest>0:00</span><span style="flex:1;font-weight:600">Descanso</span>
    <button data-a="rest-add" data-v="-15">−15</button><button data-a="rest-add" data-v="15">+15</button><button data-a="rest-skip">Saltar</button></div></div>`;

function finishSession(){
  const s=S.active;
  const exercises=s.exercises.map(e=>({exId:e.exId,sets:e.sets.filter(x=>x.done).map(x=>({kg:num(x.kg),reps:num(x.reps)}))})).filter(e=>e.sets.length);
  S.active=null;keepAwake(false);
  if(!exercises.length){save();view='train';render();toast('No había series completadas; no se ha guardado nada.');return}
  const rec={id:s.id,name:s.name,date:s.start,duration:Math.round((Date.now()-s.start)/1000),exercises};
  S.history.push(rec);save();pushWorkout(rec);summaryId=rec.id;view='summary';render();window.scrollTo(0,0);
}
function recStats(r){let vol=0,sets=0,reps=0;r.exercises.forEach(e=>{const t=EXI[e.exId]?.kind==='time';e.sets.forEach(x=>{sets++;if(!t){reps+=x.reps;vol+=x.kg*x.reps}})});return{vol,sets,reps}}
function vSummary(){
  const r=S.history.find(h=>h.id===summaryId);if(!r){view='train';return vTrain()}
  const st=recStats(r);
  return `<div class="stack"><div><div class="eyebrow">Entreno guardado · ${fmtDate(r.date)}</div><h1 style="margin-top:4px">¡Buen trabajo!</h1></div>
  <div class="kpis"><div class="kpi"><div class="v">${fmtTime(r.duration)}</div><div class="l">Duración</div></div><div class="kpi"><div class="v">${st.sets}</div><div class="l">Series completadas</div></div>
  <div class="kpi"><div class="v">${fmtNum(st.vol)}<small>kg</small></div><div class="l">Volumen levantado</div></div><div class="kpi"><div class="v">${st.reps}</div><div class="l">Repeticiones</div></div></div>
  <div class="list">${r.exercises.map(e=>`<div class="item"><div class="grow"><div class="name">${esc(EXI[e.exId]?.name||e.exId)}</div><div class="muted num" style="font-size:14px">${e.sets.map(x=>(x.kg?x.kg+' kg × ':'')+x.reps+(EXI[e.exId]?.kind==='time'?' s':'')).join(' · ')}</div></div></div>`).join('')}</div>
  <div class="row"><button class="btn ghost" style="flex:1" data-a="share-rec" data-v="${r.id}">${I.send} Enviar a un amigo</button><button class="btn primary" style="flex:1" data-a="tab" data-v="stats">Ver estadísticas</button></div></div>`;
}

/* ---------- Estadísticas ---------- */
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function vStats(){
  const H=S.history;
  if(!H.length)return `<div class="stack"><h1>Estadísticas</h1><div class="empty stack" style="align-items:center">${I.stats}<h3>Aún no hay entrenos guardados</h3><p class="muted" style="margin:0">Cuando termines tu primera sesión verás aquí tu volumen, tu racha semanal, los músculos que más trabajas y tus récords.</p><button class="btn primary" data-a="tab" data-v="train">Empezar un entreno</button></div></div>`;
  let vol=0,sets=0,time=0;H.forEach(r=>{const s=recStats(r);vol+=s.vol;sets+=s.sets;time+=r.duration});
  // semanas
  const W=8,now=weekStart(Date.now()),wk=Array(W).fill(0);
  H.forEach(r=>{const i=Math.round((now-weekStart(r.date))/(7*864e5));if(i>=0&&i<W)wk[W-1-i]++});
  let streak=0;{const set=new Set(H.map(r=>weekStart(r.date)));let w=now;if(!set.has(w))w-=7*864e5;while(set.has(w)){streak++;w-=7*864e5}}
  const maxW=Math.max(3,...wk),cw=320,ch=150,pad=28,bw=(cw-pad)/W;
  const bars=wk.map((v,i)=>{const h=(v/maxW)*(ch-40);const x=pad+i*bw+6,y=ch-22-h;const d=new Date(now-(W-1-i)*7*864e5);
    return `<rect x="${x}" y="${y}" width="${bw-12}" height="${Math.max(h,0)}" rx="4" fill="${i===W-1?'var(--accent)':'var(--muted)'}" fill-opacity="${i===W-1?1:.45}"/>
    ${v?`<text x="${x+(bw-12)/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${v}</text>`:''}
    <text x="${x+(bw-12)/2}" y="${ch-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.getDate()}/${d.getMonth()+1}</text>`}).join('');
  const grid=[0,Math.ceil(maxW/2),maxW].map(v=>{const y=ch-22-(v/maxW)*(ch-40);return `<line x1="${pad}" x2="${cw}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`}).join('');
  // músculos
  const mc={};H.forEach(r=>r.exercises.forEach(e=>{const m=EXI[e.exId]?.mus[0];if(m)mc[m]=(mc[m]||0)+e.sets.length}));
  const mlist=Object.entries(mc).sort((a,b)=>b[1]-a[1]);const mmax=mlist[0]?mlist[0][1]:1;
  // récords (1RM estimado, Epley)
  const pr={};H.forEach(r=>r.exercises.forEach(e=>{if(EXI[e.exId]?.kind==='time')return;e.sets.forEach(x=>{if(!x.kg)return;const est=x.kg*(1+x.reps/30);if(!pr[e.exId]||est>pr[e.exId].est)pr[e.exId]={est,kg:x.kg,reps:x.reps,date:r.date}})}));
  const prl=Object.entries(pr).sort((a,b)=>b[1].est-a[1].est).slice(0,8);
  return `<div class="stack"><h1>Estadísticas</h1>
  <div class="kpis"><div class="kpi"><div class="v">${H.length}</div><div class="l">Entrenos</div></div><div class="kpi"><div class="v">${streak}<small>sem</small></div><div class="l">Racha semanal</div></div>
  <div class="kpi"><div class="v">${vol>=1e4?(vol/1000).toLocaleString('es-ES',{maximumFractionDigits:1})+'<small>t</small>':fmtNum(vol)+'<small>kg</small>'}</div><div class="l">Volumen total</div></div><div class="kpi"><div class="v">${Math.round(time/60)}<small>min</small></div><div class="l">Tiempo entrenando · ${sets} series</div></div></div>
  ${vCalendar(H)}
  <section class="card chart"><h3>Entrenos por semana</h3><p class="muted" style="margin:2px 0 8px;font-size:13px">Últimas 8 semanas (lunes de cada semana)</p><svg viewBox="0 0 ${cw} ${ch}" role="img" aria-label="Entrenos por semana">${grid}${bars}</svg></section>
  <section class="card stack" style="gap:10px"><h3>Series por músculo</h3>${mlist.map(([m,n])=>`<div class="hbar"><span>${MNAME[m]}</span><span class="track"><i style="width:${n/mmax*100}%"></i></span><span class="n">${n}</span></div>`).join('')}</section>
  ${prl.length?`<section class="card stack" style="gap:6px"><h3>Récords · 1RM estimado</h3><table class="ptable">${prl.map(([id,p])=>`<tr><td>${EXI[id].name}<div class="muted" style="font-size:12px">${p.kg} kg × ${p.reps} · ${fmtDate(p.date)}</div></td><td>${Math.round(p.est)} kg</td></tr>`).join('')}</table></section>`:''}
  ${vProgressList(H)}
  <section class="stack" style="gap:10px"><h3>Historial</h3><div class="list">${H.slice().reverse().map(r=>{const s=recStats(r);return `<div class="item"><div class="grow"><div class="name">${esc(r.name)}</div><div class="muted num" style="font-size:13px">${fmtDate(r.date)} · ${fmtTime(r.duration)} · ${s.sets} series · ${fmtNum(s.vol)} kg</div></div><button class="mini" data-a="share-rec" data-v="${r.id}" aria-label="Enviar a un amigo">${I.send}</button><button class="mini" data-a="del-rec" data-v="${r.id}" aria-label="Borrar entreno">${I.x}</button></div>`}).join('')}</div></section></div>`;
}

/* ---------- Herramientas ---------- */
let toolTab=null;
const T={rmKg:80,rmReps:5,plTarget:100,plBar:20,bmiH:175,bmiW:75,iw:40,ir:20,irounds:8,itimer:null};
function vTools(){
  if(!toolTab)return vToolsList();
  let c='';
  if(toolTab==='rm'){

function rmTable(rm){return [100,95,90,85,80,75,70,65,60].map(p=>`<tr><td>${p}% <span class="muted" style="font-size:12px">· ~${({100:1,95:2,90:4,85:6,80:8,75:10,70:12,65:15,60:18})[p]} reps</span></td><td>${(Math.round(rm*p/100*2)/2).toLocaleString('es-ES')} kg</td></tr>`).join('')}
const PLATES=[[25,'#C92A2A',86],[20,'#1971C2',86],[15,'#E8A400',78],[10,'#2B8A3E',70],[5,'#495057',56],[2.5,'#868E96',46],[1.25,'#ADB5BD',38]];
function platesOut(){
  let side=(num(T.plTarget)-num(T.plBar))/2;
  if(side<0)return `<p class="muted" style="margin:0">El peso total debe ser mayor que la barra.</p>`;
  const out=[];for(const [w] of PLATES){while(side>=w-1e-9){out.push(w);side-=w}}
  const rest=Math.round(side*100)/100;
  return `<div class="plates" aria-hidden="true"><span class="barend"></span>${out.map(w=>{const p=PLATES.find(x=>x[0]===w);return `<span class="p" style="background:${p[1]};width:${w>=10?18:13}px;height:${p[2]}px">${w}</span>`}).join('')}<span class="barend" style="width:20px"></span></div>
  <div><div class="eyebrow">Por cada lado</div><div style="font-size:20px;font-weight:700" class="num">${out.length?out.map(w=>w.toLocaleString('es-ES')).join(' + ')+' kg':'Sin discos'}</div>${rest?`<p class="muted" style="margin:4px 0 0;font-size:13px">Sobran ${rest.toLocaleString('es-ES')} kg por lado que no se pueden cargar con discos estándar.</p>`:''}</div>`;
}
function bmiOut(){const h=num(T.bmiH)/100,w=num(T.bmiW);if(!h||!w)return '';const b=w/(h*h);const cat=b<18.5?'Bajo peso':b<25?'Normal':b<30?'Sobrepeso':'Obesidad';
  return `<div class="eyebrow">Tu IMC</div><div class="big">${b.toLocaleString('es-ES',{maximumFractionDigits:1})}</div><div style="font-weight:600">${cat}</div><p class="muted" style="margin:4px 0 0;font-size:13px">Rango normal para tu altura: ${Math.round(18.5*h*h)}–${Math.round(24.9*h*h)} kg.</p>`}

/* ---------- Temporizadores ---------- */
function tick(){
  const s=S.active;
  if(s){const el=fmtTime((Date.now()-s.start)/1000);document.querySelectorAll('[data-elapsed]').forEach(e=>e.textContent=el);
    if(s.rest){const left=(s.rest.end-Date.now())/1000;
      if(left<=0){s.rest=null;save();beep();if(view==='session')render();return}
      const t=document.querySelector('[data-rest]');if(t)t.textContent=fmtTime(Math.ceil(left));
      const f=document.querySelector('[data-rest-fill]');if(f)f.style.width=(100-left/s.rest.total*100)+'%';}}
  const it=T.itimer;
  if(it&&!it.paused){const left=(it.end-Date.now())/1000;
    if(left<=0){beep();if(it.phase==='work'&&num(T.ir)>0&&it.round<num(T.irounds)){it.phase='rest';it.end=Date.now()+num(T.ir)*1000}
      else if(it.round<num(T.irounds)){it.round++;it.phase='work';it.end=Date.now()+num(T.iw)*1000}
      else{T.itimer=null;keepAwake(!!S.active);if(view==='tools')render();toast('Intervalos terminados');return}}
    paintInterval();}
}
function paintInterval(){const it=T.itimer,p=document.querySelector('[data-int-phase]');if(!p)return;
  if(!it){p.textContent='Listo';document.querySelector('[data-int-time]').textContent=fmtTime(num(T.iw));document.querySelector('[data-int-round]').textContent=`Ronda 0 de ${num(T.irounds)}`;return}
  const left=it.paused?it.left:(it.end-Date.now())/1000;
  p.textContent=it.paused?'En pausa':it.phase==='work'?'Trabajo':'Descanso';p.style.color=it.phase==='work'?'var(--accent)':'var(--ok)';
  document.querySelector('[data-int-time]').textContent=fmtTime(Math.ceil(left));document.querySelector('[data-int-round]').textContent=`Ronda ${it.round} de ${num(T.irounds)}`;}
setInterval(tick,250);

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.a,v=b.dataset.v,w=S.wiz,s=S.active;
  switch(a){
    case 'close-layer':if(e.target===b||b.tagName==='BUTTON')closeLayer();return;
    case 'theme':S.settings.theme=isDark()?'light':'dark';applyTheme();save();render();return;
    case 'set-theme':S.settings.theme=v||null;applyTheme();save();render();return;
    case 'tab':view=v;render();window.scrollTo(0,0);return;
    case 'resume':view='session';render();window.scrollTo(0,0);return;
    case 'goto-step':w.step=+v;break;
    case 'eq':w.equip=w.equip.includes(v)?w.equip.filter(x=>x!==v):[...w.equip,v];{const es=new Set(w.equip);w.muscles=w.muscles.filter(m=>EX.some(x=>canDo(x,es)&&x.mus.includes(m)))}break;
    case 'mu':w.muscles=w.muscles.includes(v)?w.muscles.filter(x=>x!==v):[...w.muscles,v];break;
    case 'mu-preset':{const es=new Set(w.equip);w.muscles=v.split(',').filter(m=>EX.some(x=>canDo(x,es)&&x.mus.includes(m)))}break;
    case 'next':w.step=Math.min(3,w.step+1);window.scrollTo(0,0);break;
    case 'prev':w.step=Math.max(1,w.step-1);window.scrollTo(0,0);break;
    case 'regen':genList();break;
    case 'rm':w.list=w.list.filter(x=>x!==v);break;
    case 'swap':{const es=new Set(w.equip),m=pickGroup(v);const opts=EX.filter(x=>canDo(x,es)&&x.mus.includes(m)&&!w.list.includes(x.id));
      if(!opts.length){toast('No hay más ejercicios para '+MNAME[m]+' con tu equipo');return}
      const pri=opts.filter(x=>x.mus[0]===m),pool=pri.length?pri:opts;w.list[w.list.indexOf(v)]=pool[Math.floor(Math.random()*pool.length)].id}break;
    case 'add-sheet':addSheet(v);return;
    case 'per':w.per=+v;break;
    case 'info':infoSheet(v);return;
    case 'start-custom':startSession(w.muscles.map(m=>MNAME[m]).slice(0,3).join(' · ')+(w.muscles.length>3?' …':''),w.list.map(id=>({exId:id,sets:3})));return;
    case 'start-prog':{const [pid,di]=v.split(':');const p=PROGRAMS.find(x=>x.id===pid),d=p.days[+di];startSession(p.name.split(' · ')[0]+' · '+d.n,d.x.map(([id,n,t])=>({exId:id,sets:n,target:t})))}return;
    case 'goto-ex':s.idx=+v;break;
    case 'ex-prev':s.idx=Math.max(0,s.idx-1);break;
    case 'ex-next':s.idx=Math.min(s.exercises.length-1,s.idx+1);break;
    case 'add-set':{const c=s.exercises[s.idx],l=c.sets[c.sets.length-1];c.sets.push({kg:l?l.kg:'',reps:'',done:false})}break;
    case 'rm-set':s.exercises[s.idx].sets.pop();break;
    case 'done':{unlockAudio();const c=s.exercises[s.idx],st=c.sets[+v];st.done=!st.done;
      if(st.done){const row=b.closest('tr');const kgI=row.querySelector('[data-f="kg"]'),rpI=row.querySelector('[data-f="reps"]');
        if(st.kg==='')st.kg=kgI.placeholder==='0'?'':kgI.placeholder;if(st.reps==='')st.reps=rpI.placeholder;
        if(c.sets.slice(+v+1).length&&+v+1<c.sets.length&&c.sets[+v+1].kg==='')c.sets[+v+1].kg=st.kg;
        const allDone=s.exercises.every(x=>x.sets.every(y=>y.done));
        if(!allDone)s.rest={end:Date.now()+S.settings.rest*1000,total:S.settings.rest};
        if(c.sets.every(y=>y.done)&&s.idx<s.exercises.length-1)setTimeout(()=>{if(S.active===s&&s.exercises[s.idx]===c){s.idx++;save();render()}},700);
      }}break;
    case 'rest-add':if(s.rest){s.rest.end+= +v*1000;s.rest.total=Math.max(s.rest.total+ +v,1)}break;
    case 'rest-skip':s.rest=null;break;
    case 'leave':view='train';break;
    case 'finish':{const n=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
      confirmBox('¿Terminar entreno?',n?`Se guardarán ${n} series completadas.`:'No has completado ninguna serie; el entreno se descartará.',n?'Terminar y guardar':'Descartar',finishSession,!n)}return;
    case 'del-rec':confirmBox('¿Borrar este entreno?','Se eliminará del historial y de las estadísticas.','Borrar',()=>{S.history=S.history.filter(r=>r.id!==v);deleteWorkout(v);save();render()});return;
    case 'tool':toolTab=v||null;window.scrollTo(0,0);break;
    case 'int-toggle':{unlockAudio();const it=T.itimer;
      if(!it){T.itimer={phase:'work',round:1,end:Date.now()+num(T.iw)*1000,paused:false};keepAwake(true)}
      else if(it.paused){it.paused=false;it.end=Date.now()+it.left*1000}else{it.paused=true;it.left=(it.end-Date.now())/1000}}break;
    case 'int-reset':T.itimer=null;break;
    case 'backup-copy':{const txt=JSON.stringify({app:'forja',v:1,settings:S.settings,history:S.history});
      navigator.clipboard.writeText(txt).then(()=>toast('Copia copiada. Pégala en Notas.'),()=>{const ta=$('#importTxt');ta.value=txt;ta.select();toast('Selecciona y copia el texto del cuadro')})}return;
    case 'backup-import':{try{const d=JSON.parse($('#importTxt').value);if(!Array.isArray(d.history))throw 0;
      const clean=d.history.filter(r=>r&&r.id&&r.date&&Array.isArray(r.exercises)).map(r=>({id:String(r.id),name:String(r.name||'Entreno'),date:+r.date,duration:+r.duration||0,exercises:r.exercises.filter(e=>EXI[e.exId]).map(e=>({exId:e.exId,sets:(e.sets||[]).map(x=>({kg:num(x.kg),reps:num(x.reps)}))}))}));
      confirmBox('¿Restaurar copia?',`Se cargarán ${clean.length} entrenos y se añadirán a tu cuenta.`,'Restaurar',()=>{const have=new Set(S.history.map(r=>r.id));clean.forEach(r=>{if(!have.has(r.id))S.history.push(r)});S.history.sort((a,b)=>a.date-b.date);save();syncAll();render();toast('Copia restaurada')},false)}
      catch(err){toast('El texto no es una copia de seguridad válida de Forja')}}return;
    case 'wipe':confirmBox('¿Borrar todo el historial?','Se eliminarán todos tus entrenos guardados. No se puede deshacer.','Borrar todo',()=>{S.history.forEach(r=>deleteWorkout(r.id));S.history=[];save();render();toast('Historial borrado')});return;
    default:return;
  }
  save();render();
});

async function authInit(){
  if(!sb){A.status='ready';render();return}
  render();
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  await onSession(session);
  sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(()=>{
    if(ev==='SIGNED_OUT'){onSession(null)}
    else if(ses&&ses.user&&ses.user.id!==A.user?.id){onSession(ses)}
  },0)});
  addEventListener('online',()=>{A.offline=false;if(A.user&&!A.profile)loadProfile().then(render);syncAll();refreshSocial()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&canSync()){syncAll();refreshSocial()}});

async function onSession(session){
  if(!session){A.user=null;A.profile=null;A.status='ready';A.needPass=false;useUser(null);F.friends=[];F.inbox=[];render();return}
  A.user=session.user;useUser(A.user.id);

}

/* Sincronización del historial con la cuenta */
const toRow=r=>({id:r.id,user_id:A.user.id,name:r.name,date:new Date(r.date).toISOString(),duration:r.duration||0,exercises:r.exercises});
const fromRow=w=>({id:w.id,name:w.name,date:Date.parse(w.date),duration:w.duration,exercises:w.exercises,synced:true});
let syncing=false;
async function syncAll(){
  if(!canSync()||syncing)return;syncing=true;
  try{
    if(S.deleted.length){const ids=S.deleted.slice();const {error}=await sb.from('workouts').delete().in('id',ids);if(!error){S.deleted=S.deleted.filter(x=>!ids.includes(x))}}
    const {data,error}=await sb.from('workouts').select('id,name,date,duration,exercises').eq('user_id',A.user.id).order('date');
    if(error)throw error;
    const server=new Map(data.map(w=>[w.id,w]));
    const up=S.history.filter(r=>!server.has(r.id)&&!r.synced);
    const gone=new Set(S.deleted);
    const merged=[...data.filter(w=>!gone.has(w.id)).map(fromRow),...up];
    if(up.length){const {error:e2}=await sb.from('workouts').upsert(up.map(toRow));if(!e2)up.forEach(r=>r.synced=true)}
    merged.sort((a,b)=>a.date-b.date);
    const changed=JSON.stringify(merged.map(r=>r.id))!==JSON.stringify(S.history.map(r=>r.id));
    S.history=merged;save();if(changed&&(view==='stats'||view==='train'))softRender();
  }catch(e){}finally{syncing=false}
}
async function pushWorkout(r){if(!canSync())return;try{const {error}=await sb.from('workouts').upsert(toRow(r));if(!error){r.synced=true;save()}}catch(e){}}
async function deleteWorkout(id){if(!sb||!A.user)return;S.deleted.push(id);save();if(!canSync())return;try{const {error}=await sb.from('workouts').delete().eq('id',id);if(!error){S.deleted=S.deleted.filter(x=>x!==id);save()}}catch(e){}}

/* Administración */
async function loadAdmin(){
  try{const [st,us]=await Promise.all([sb.rpc('admin_stats'),sb.rpc('admin_users')]);
    if(st.error)throw st.error;if(us.error)throw us.error;ADM.stats=st.data;ADM.users=us.data;softRender()}catch(e){toast(errMsg(e))}
}
function vAdmin(){
  if(!isAdmin()){view='me';return vMe()}
  const head=`<div class="row"><button class="mini" data-a="tab" data-v="me" aria-label="Volver">${I.left}</button><h1>Administración</h1></div>`;
  if(!ADM.stats||!ADM.users)return `<div class="stack">${head}<p class="muted">Cargando datos…</p></div>`;
  const s=ADM.stats,sx=s.sex||{},sxMax=Math.max(1,...Object.values(sx)),cities=s.cities||[],cMax=Math.max(1,...cities.map(c=>c.n));
  const q=ADM.q.toLowerCase();
  const users=ADM.users.filter(u=>!q||[u.full_name,u.nickname,u.email,u.city].some(x=>(x||'').toLowerCase().includes(q)));
  return `<div class="stack">${head}
  <div class="kpis"><div class="kpi"><div class="v">${s.users}</div><div class="l">Usuarios · ${s.new_7d} nuevos esta semana</div></div><div class="kpi"><div class="v">${s.active_7d}</div><div class="l">Han entrenado en 7 días</div></div>
  <div class="kpi"><div class="v">${s.workouts}</div><div class="l">Entrenos · ${s.workouts_7d} esta semana</div></div><div class="kpi"><div class="v">${s.avg_age??'—'}</div><div class="l">Edad media</div></div>
  <div class="kpi"><div class="v">${s.friendships}</div><div class="l">Amistades</div></div><div class="kpi"><div class="v">${s.shared}</div><div class="l">Entrenos compartidos</div></div></div>
  <section class="card stack" style="gap:10px"><h3>Sexo</h3>${Object.entries(sx).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="hbar"><span>${SEX[k]||'Sin completar'}</span><span class="track"><i style="width:${n/sxMax*100}%"></i></span><span class="n">${n}</span></div>`).join('')}</section>
  ${[['Experiencia',s.level,LEVEL],['Objetivo',s.goal,GOAL],['Actividad diaria',s.activity,ACTIVITY]].map(([t,o,lab])=>{o=o||{};const mx=Math.max(1,...Object.values(o));return `<section class="card stack" style="gap:10px"><h3>${t}</h3>${Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="hbar"><span>${lab[k]?short(lab[k]):'Sin completar'}</span><span class="track"><i style="width:${n/mx*100}%"></i></span><span class="n">${n}</span></div>`).join('')}${t==='Experiencia'&&s.avg_gym_days!=null?`<p class="muted" style="margin:0;font-size:13px">Media: ${s.avg_gym_days} días de gimnasio a la semana.</p>`:''}</section>`}).join('')}
  <section class="card stack" style="gap:10px"><h3>Ciudades</h3>${cities.length?cities.map(c=>`<div class="hbar"><span>${esc(c.city)}</span><span class="track"><i style="width:${c.n/cMax*100}%"></i></span><span class="n">${c.n}</span></div>`).join(''):'<p class="muted" style="margin:0">Aún no hay datos.</p>'}</section>
  <section class="stack" style="gap:8px"><div class="row between"><h3>Usuarios (${ADM.users.length})</h3>${s.blocked?`<span class="pill bad">${s.blocked} bloqueados</span>`:''}</div>
    <input class="search" id="admQ" data-adm-q placeholder="Buscar por nombre, nick, correo o ciudad" value="${esc(ADM.q)}" autocomplete="off">
    <div class="list">${users.map(u=>`<div class="item admin-row" style="align-items:flex-start"><div class="grow"><div class="name">${esc(u.full_name||'Perfil sin completar')} ${u.role==='admin'?'<span class="pill">Admin</span>':''} ${u.blocked?'<span class="pill bad">Bloqueado</span>':''}</div>
      <div class="meta">${u.nickname?'@'+esc(u.nickname)+' · ':''}${esc(u.email)}</div>
      <div class="meta">${[u.age?u.age+' años':'',SEX[u.sex]||'',u.city||''].filter(Boolean).map(esc).join(' · ')||'Sin datos de perfil'}</div>
      ${u.level?`<div class="meta">${[short(LEVEL[u.level]||''),GOAL[u.goal]||'',u.gym_days!=null?u.gym_days+' días/sem':'',short(ACTIVITY[u.activity]||'')].filter(Boolean).map(esc).join(' · ')}</div>`:''}
      <div class="meta num">Alta ${fmtDate(u.created_at)} · ${u.workouts} entrenos${u.last_workout?' · último '+fmtDate(u.last_workout):''}</div></div>
      ${u.id===A.user.id?'':`<div class="stack" style="gap:6px"><button class="btn ghost sm" data-a="adm-block" data-v="${u.id}">${u.blocked?'Desbloquear':'Bloquear'}</button><button class="btn danger sm" data-a="adm-delete" data-v="${u.id}">Borrar</button></div>`}</div>`).join('')||'<div class="item"><span class="muted">Nadie coincide con la búsqueda.</span></div>'}</div></section></div>`;
}

/* Formularios */
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f));const kind=f.dataset.form;setErr(f,'');
  try{
    if(kind==='login'){
      const email=(fd.email||'').trim().toLowerCase();A.email=email;
      if(!email||!fd.password)return setErr(f,'Escribe tu correo y tu contraseña.');
      busy(f,true);const {data,error}=await sb.auth.signInWithPassword({email,password:fd.password});busy(f,false);
      if(error)return setErr(f,errMsg(error));await onSession(data.session);
    }else if(kind==='send-code'){
      const email=(fd.email||'').trim().toLowerCase();A.email=email;
      if(!/^\S+@\S+\.\S+$/.test(email))return setErr(f,'Escribe un correo válido, por ejemplo nombre@gmail.com.');
      busy(f,true);const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});busy(f,false);
      if(error)return setErr(f,errMsg(error));A.resendAt=Date.now()+60000;A.mode='code-verify';render();setTimeout(()=>$('#cvCode')?.focus(),50);
    }else if(kind==='verify-code'){
      const token=(fd.code||'').replace(/\D/g,'');if(token.length<6)return setErr(f,'Escribe el código que te ha llegado por correo.');
      busy(f,true);const {data,error}=await sb.auth.verifyOtp({email:A.email,token,type:'email'});busy(f,false);
      if(error)return setErr(f,errMsg(error));
      try{localStorage.setItem('forja.needpass',data.user.id)}catch(x){}A.mode='login';await onSession(data.session);
    }else if(kind==='set-password'){
      if((fd.password||'').length<8)return setErr(f,'La contraseña debe tener al menos 8 caracteres.');
      if(fd.password!==fd.password2)return setErr(f,'Las dos contraseñas no coinciden.');
      busy(f,true);const {error}=await sb.auth.updateUser({password:fd.password});busy(f,false);
      if(error)return setErr(f,errMsg(error));
      try{localStorage.removeItem('forja.needpass')}catch(x){}A.needPass=false;toast('Contraseña guardada');render();
    }else if(kind==='profile'){
      const nick=(fd.nickname||'').trim(),age=parseInt(fd.age,10),edit=f.dataset.edit==='1';
      if(!(fd.full_name||'').trim())return setErr(f,'Escribe tu nombre y apellidos.');
      if(!/^[A-Za-z0-9_.]{3,20}$/.test(nick))return setErr(f,'El nick debe tener entre 3 y 20 caracteres: letras sin tilde, números, punto o guion bajo.');
      if(!(age>=10&&age<=110))return setErr(f,'Escribe una edad válida.');
      if(!fd.sex)return setErr(f,'Elige una opción en sexo.');
      if(!(fd.city||'').trim())return setErr(f,'Escribe la ciudad donde entrenas.');
      if(fd.gym_days===''||!fd.activity||!fd.level||!fd.goal)return setErr(f,'Responde a las cuatro preguntas sobre tu entrenamiento.');
      const row={full_name:fd.full_name.trim(),nickname:nick,age,sex:fd.sex,city:fd.city.trim(),discoverable:!!fd.discoverable,gym_days:parseInt(fd.gym_days,10),activity:fd.activity,level:fd.level,goal:fd.goal};
      busy(f,true);const {data,error}=await sb.from('profiles').update(row).eq('id',A.user.id).select().single();busy(f,false);
      if(error)return setErr(f,errMsg(error));
      A.profile=data;S.profile=data;save();
      if(edit){toast('Perfil guardado');render()}else{view='train';render();window.scrollTo(0,0);syncAll();refreshSocial();toast('¡Bienvenido a Forja, '+nick+'!')}
    }else if(kind==='search'){
      const q=(fd.q||'').trim();F.q=q;if(q.length<2){F.results=null;render();return toast('Escribe al menos 2 letras')}
      busy(f,true);const {data,error}=await sb.rpc('search_profiles',{q});busy(f,false);if(error)throw error;F.results=data||[];render();
    }else if(kind==='share'){
      const rec=S.history.find(r=>r.id===f.dataset.rec);if(!rec)return;
      busy(f,true);const {error}=await sb.from('shared_workouts').insert({from_user:A.user.id,to_user:fd.to,name:rec.name,items:recItems(rec),message:(fd.message||'').trim()||null});busy(f,false);
      if(error)return setErr(f,errMsg(error));closeLayer();toast('Entreno enviado a '+(F.friends.find(x=>x.id===fd.to)?.nickname||'tu amigo'));
    }
  }catch(err){busy(f,false);setErr(f,errMsg(err))}
});

/* Acciones */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  try{switch(a){
    case 'auth-mode':A.mode=v;render();break;
    case 'auth-retry':A.offline=false;render();await loadProfile();render();break;
    case 'resend-code':{const left=Math.ceil((A.resendAt-Date.now())/1000);if(left>0)return toast(`Espera ${left} s para pedir otro código`);
      const {error}=await sb.auth.signInWithOtp({email:A.email,options:{shouldCreateUser:true}});if(error)return toast(errMsg(error));A.resendAt=Date.now()+60000;toast('Te hemos enviado otro código');break}
    case 'logout':confirmBox('¿Cerrar sesión?','Tus entrenos están guardados en tu cuenta. Podrás volver a entrar con tu correo y contraseña.','Cerrar sesión',logout,false);break;
    case 'pass-cancel':try{localStorage.removeItem('forja.needpass')}catch(x){}A.needPass=false;render();break;
    case 'auth-change-pass':try{localStorage.setItem('forja.needpass',A.user.id)}catch(x){}A.needPass=true;render();window.scrollTo(0,0);break;
    case 'tab':if(v==='friends')refreshSocial();if(v==='admin'){ADM.stats=null;ADM.users=null;loadAdmin()}break;
    case 'invite':invite();break;
    case 'fr-add':{const {error}=await sb.from('friendships').insert({requester:A.user.id,addressee:v});if(error)throw error;toast('Solicitud enviada');await refreshSocial();render();break}
    case 'fr-accept':{const {error}=await sb.from('friendships').update({status:'accepted'}).eq('requester',v).eq('addressee',A.user.id);if(error)throw error;toast('¡Ahora sois amigos!');await refreshSocial();render();break}
    case 'fr-del':{const {error}=await sb.from('friendships').delete().or(`and(requester.eq.${A.user.id},addressee.eq.${v}),and(requester.eq.${v},addressee.eq.${A.user.id})`);if(error)throw error;await refreshSocial();render();break}
    case 'fr-remove':confirmBox('¿Eliminar de tus amigos?','Dejaréis de ver vuestro progreso y de poder enviaros entrenos.','Eliminar',async()=>{await sb.from('friendships').delete().or(`and(requester.eq.${A.user.id},addressee.eq.${v}),and(requester.eq.${v},addressee.eq.${A.user.id})`);F.friend=null;view='friends';await refreshSocial();render()});break;
    case 'fr-open':openFriend(v);break;
    case 'copy-friend':{const r=F.friend?.workouts?.find(x=>x.id===v);if(r)startSession(r.name+' · de '+F.friend.nickname,recItems(r));break}
    case 'share-rec':{const r=S.history.find(x=>x.id===v);if(!r)return;if(!F.friends.length)await refreshSocial();shareSheet(r,b.dataset.to);break}
    case 'share-pick':pickRecSheet(v);break;
    case 'inbox-start':{const x=F.inbox.find(i=>i.id===v);if(!x)return;sb.from('shared_workouts').update({seen:true}).eq('id',v).then(()=>refreshSocial());x.seen=true;startSession(x.name+' · de '+(x.from_nick||'un amigo'),(x.items||[]).filter(it=>EXI[it.exId]));break}
    case 'inbox-del':{const {error}=await sb.from('shared_workouts').delete().eq('id',v);if(error)throw error;await refreshSocial();render();break}
    case 'adm-block':{const u=ADM.users.find(x=>x.id===v);if(!u)return;
      confirmBox(u.blocked?'¿Desbloquear esta cuenta?':'¿Bloquear esta cuenta?',u.blocked?`${u.email} podrá volver a usar Forja.`:`${u.email} no podrá usar Forja hasta que la desbloquees. Sus datos se conservan.`,u.blocked?'Desbloquear':'Bloquear',async()=>{const {error}=await sb.from('profiles').update({blocked:!u.blocked}).eq('id',v);if(error)return toast(errMsg(error));toast(u.blocked?'Cuenta desbloqueada':'Cuenta bloqueada');loadAdmin()},!u.blocked);break}
    case 'adm-delete':{const u=ADM.users.find(x=>x.id===v);if(!u)return;
      confirmBox('¿Borrar esta cuenta?',`Se borrarán para siempre la cuenta de ${u.email}, su perfil, sus entrenos y sus amistades. No se puede deshacer.`,'Borrar para siempre',async()=>{const {error}=await sb.rpc('admin_delete_user',{uid:v});if(error)return toast(errMsg(error));toast('Cuenta borrada');loadAdmin()});break}
  }}catch(err){toast(errMsg(err))}
});
