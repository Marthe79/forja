/* ---------- Perfil: preguntas de entrenamiento ---------- */
const ACTIVITY={sedentaria:'Sedentario: trabajo sentado y me muevo poco',ligera:'Poco activo: camino un poco cada día',activa:'Activo: paso gran parte del día de pie o moviéndome',muy_activa:'Muy activo: trabajo físico o hago mucho deporte'};
const LEVEL={principiante:'Principiante: menos de 6 meses entrenando',intermedio:'Intermedio: entre 6 meses y 2 años',avanzado:'Avanzado: más de 2 años entrenando',competicion:'Competición: entreno para competir'};
const GOAL={perder_grasa:'Perder grasa',ganar_musculo:'Ganar músculo',fuerza:'Ganar fuerza',salud:'Salud y bienestar',rendimiento:'Rendimiento en mi deporte'};
const short=t=>String(t).split(':')[0];
function selectField(id,name,label,opts,val){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${name}" required><option value="">Elige…</option>${Object.entries(opts).map(([k,l])=>`<option value="${k}" ${String(val)===String(k)?'selected':''}>${l}</option>`).join('')}</select></div>`}

/* ---------- Progreso por ejercicio ---------- */
const relDay=t=>{const d=Math.round((weekStart0(Date.now())-weekStart0(t))/864e5);return d<=0?'hoy':d===1?'ayer':`hace ${d} días`};
function weekStart0(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
const setTxt=(x,isT)=>(x.kg?x.kg.toLocaleString('es-ES')+' kg × ':'')+x.reps+(isT?' s':'');
function exHist(exId,H=S.history){
  return H.filter(r=>r.exercises.some(e=>e.exId===exId)).map(r=>{const e=r.exercises.find(x=>x.exId===exId);
    const best=e.sets.reduce((b,x)=>(x.kg>b.kg||(x.kg===b.kg&&x.reps>b.reps))?x:b,{kg:0,reps:0});
    return {date:r.date,sets:e.sets,best,e1:Math.max(0,...e.sets.map(x=>x.kg?x.kg*(1+x.reps/30):0)),maxReps:Math.max(0,...e.sets.map(x=>x.reps||0))}}).sort((a,b)=>a.date-b.date);
}
function progressSheet(exId){
  const e=EXI[exId],h=exHist(exId),isT=e.kind==='time';
  let body;
  if(!h.length){body=`<p class="muted">Aún no has hecho este ejercicio. Cuando completes series en un entreno, aquí verás tu evolución: peso, repeticiones y récords.</p>`}
  else{
    const useKg=h.some(x=>x.best.kg>0),val=x=>useKg?x.best.kg:x.maxReps,unit=useKg?'kg':(isT?'s':'reps');
    const last=h[h.length-1],first=h[0],best=h.reduce((b,x)=>val(x)>val(b)?x:b,h[0]),diff=val(last)-val(first);
    const pts=h.slice(-20),W=320,Hh=150,px=30,py=18,vs=pts.map(val),mn=Math.min(...vs),mx=Math.max(...vs),rng=mx-mn||1;
    const xy=pts.map((x,i)=>[px+(pts.length===1?(W-px-10)/2:i*(W-px-10)/(pts.length-1)),py+(Hh-py*2)*(1-(val(x)-mn)/rng)]);
    const chart=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Evolución de ${esc(e.name)}">
      ${[mx,mn].map((v,i)=>{const y=i?Hh-py:py;return `<line x1="${px}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${px-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toLocaleString('es-ES')}</text>`}).join('')}
      <polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===xy.length-1?5:3}" fill="var(--accent)"/>`).join('')}
      <text x="${px}" y="${Hh-2}" font-size="10" fill="var(--muted)">${new Date(pts[0].date).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</text>
      <text x="${W}" y="${Hh-2}" text-anchor="end" font-size="10" fill="var(--muted)">${new Date(last.date).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</text></svg>`;
    body=`<div class="kpis"><div class="kpi"><div class="v" style="font-size:24px">${setTxt(last.best,isT)}</div><div class="l">Última vez · ${relDay(last.date)}</div></div>
      <div class="kpi"><div class="v" style="font-size:24px">${val(best).toLocaleString('es-ES')}<small>${unit}</small></div><div class="l">Tu mejor marca · ${fmtDate(best.date)}</div></div>
      ${useKg?`<div class="kpi"><div class="v" style="font-size:24px">${Math.round(Math.max(...h.map(x=>x.e1)))}<small>kg</small></div><div class="l">Máximo estimado a 1 repetición</div></div>`:''}
      <div class="kpi"><div class="v" style="font-size:24px">${h.length}</div><div class="l">Sesiones · ${h.length>1?(diff>0?'+':'')+diff.toLocaleString('es-ES')+' '+unit+' desde la primera':'primera sesión'}</div></div></div>
      <section class="card chart"><h3>Evolución de ${useKg?'tu mejor peso':isT?'tu mejor tiempo':'tus repeticiones'}</h3>${h.length>1?chart:'<p class="muted" style="margin:6px 0 0">Haz este ejercicio en otra sesión para ver la gráfica.</p>'}</section>
      <section class="stack" style="gap:8px"><h3>Historial</h3><div class="list">${h.slice().reverse().slice(0,12).map(x=>`<div class="item"><div class="grow"><div class="name">${fmtDate(x.date)}</div><div class="muted num" style="font-size:13px">${x.sets.map(s=>setTxt(s,isT)).join(' · ')}</div></div></div>`).join('')}</div></section>`;
  }
  $('#layer').innerHTML=`<div class="overlay" data-a="close-layer"><div class="sheet" role="dialog" aria-modal="true" aria-label="Progreso en ${esc(e.name)}">
    <div class="row between"><div class="row" style="min-width:0">${demo(exId,'thumb')}<div style="min-width:0"><div class="eyebrow">Mi progreso</div><h2>${e.name}</h2></div></div><button class="mini" data-a="close-layer" aria-label="Cerrar">${I.x}</button></div>
    <div class="scroll stack">${body}</div></div></div>`;
}
function vProgressList(H){
  const ids=[...new Set(H.slice().reverse().flatMap(r=>r.exercises.map(e=>e.exId)))].filter(id=>EXI[id]);
  if(!ids.length)return '';
  return `<section class="stack" style="gap:8px"><h3>Progreso por ejercicio</h3><p class="muted" style="margin:0;font-size:14px">Toca un ejercicio para ver tu evolución, tu récord y todas tus sesiones.</p><div class="list">${ids.slice(0,40).map(id=>{const h=exHist(id,H),l=h[h.length-1],p=h[h.length-2],isT=EXI[id].kind==='time';
    const d=p?(l.best.kg||p.best.kg?l.best.kg-p.best.kg:l.maxReps-p.maxReps):0,u=(l.best.kg||p?.best.kg)?' kg':isT?' s':' reps';
    return `<button class="item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%" data-a="prog-ex" data-v="${id}">${demo(id,'thumb')}<div class="grow"><div class="name">${EXI[id].name}</div><div class="muted num" style="font-size:13px">${setTxt(l.best,isT)} · ${relDay(l.date)}</div></div>${d?`<span class="pill ${d>0?'okp':'bad'}">${d>0?'▲ +':'▼ '}${d.toLocaleString('es-ES')}${u}</span>`:''}</button>`}).join('')}</div></section>`;
}

/* ---------- Calendario ---------- */
let calM=null;
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function vCalendar(H){
  const now=new Date(),base=calM||new Date(now.getFullYear(),now.getMonth(),1),y=base.getFullYear(),m=base.getMonth();
  const by={};H.forEach(r=>{const k=dayKey(r.date);(by[k]=by[k]||[]).push(r)});
  const off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),todayK=dayKey(Date.now());
  let cells='';for(let i=0;i<off;i++)cells+='<span></span>';
  let count=0;
  for(let d=1;d<=days;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),n=(by[k]||[]).length;if(n)count++;
    cells+=n?`<button class="cal-d on ${k===todayK?'today':''}" data-a="cal-day" data-v="${k}" aria-label="${d}: ${n} entreno${n>1?'s':''}">${d}</button>`:`<span class="cal-d ${k===todayK?'today':''}">${d}</span>`}
  const title=cap(base.toLocaleDateString('es-ES',{month:'long',year:'numeric'}));
  return `<section class="card stack" style="gap:10px"><div class="row between"><button class="mini" data-a="cal-move" data-v="-1" aria-label="Mes anterior">${I.left}</button>
    <div style="text-align:center"><h3>${title}</h3><div class="muted" style="font-size:13px">${count} día${count===1?'':'s'} entrenado${count===1?'':'s'}</div></div>
    <button class="mini" data-a="cal-move" data-v="1" aria-label="Mes siguiente">${I.right}</button></div>
    <div class="cal">${['L','M','X','J','V','S','D'].map(d=>`<b>${d}</b>`).join('')}${cells}</div>
    <p class="muted" style="margin:0;font-size:13px">Los días marcados son los que entrenaste. Tócalos para ver qué hiciste.</p></section>`;
}
function daySheet(k){
  const rs=S.history.filter(r=>dayKey(r.date)===k);if(!rs.length)return;
  const d=new Date(rs[0].date);
  $('#layer').innerHTML=`<div class="overlay" data-a="close-layer"><div class="sheet" role="dialog" aria-modal="true" aria-label="Entreno del día">
    <div class="row between"><div><div class="eyebrow">Tu entreno</div><h2>${cap(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}</h2></div><button class="mini" data-a="close-layer" aria-label="Cerrar">${I.x}</button></div>
    <div class="scroll stack">${rs.map(r=>{const st=recStats(r);return `<section class="stack" style="gap:8px">
      <div><h3>${esc(r.name)}</h3><div class="muted num" style="font-size:13px">${new Date(r.date).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})} · ${fmtTime(r.duration)} · ${st.sets} series · ${fmtNum(st.vol)} kg levantados</div></div>
      <div class="list">${r.exercises.map(e=>{const isT=EXI[e.exId]?.kind==='time';return `<button class="item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%" data-a="prog-ex" data-v="${e.exId}">${EXI[e.exId]?demo(e.exId,'thumb'):''}<div class="grow"><div class="name">${esc(EXI[e.exId]?.name||e.exId)}</div><div class="muted num" style="font-size:13px">${e.sets.map(x=>setTxt(x,isT)).join(' · ')}</div></div></button>`}).join('')}</div>
      <button class="btn ghost block" data-a="repeat-rec" data-v="${r.id}">Repetir este entreno</button></section>`}).join('')}</div></div></div>`;
}

/* ---------- Mi semana ---------- */
const DAYS=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const todayIdx=()=>((new Date().getDay()+6)%7)+1;
let progTab='week',PD=null;
const getPlan=()=>{const p=A.profile?.plan;return p&&p.days?p:{days:{}}};
const dayMuscles=d=>(d.muscles||[]).map(m=>MNAME[m]).join(' · ')||'Entreno';
async function savePlan(plan){
  A.profile.plan=plan;S.profile=A.profile;save();
  if(!canSync())return toast('Guardado en este dispositivo. Se subirá cuando tengas conexión.');
  const {error}=await sb.from('profiles').update({plan}).eq('id',A.user.id);
  if(error)toast(errMsg(error));else toast('Plan guardado');
}
function vWeek(){
  const plan=getPlan(),t=todayIdx();
  return `<p class="muted" style="margin:0">Organiza tu semana: elige qué días entrenas, qué músculos y qué ejercicios. Después, cada día lo empiezas con un toque.</p>
  <div class="stack" style="gap:10px">${[1,2,3,4,5,6,7].map(d=>{const day=plan.days[d];const items=day?.items||[];
    return `<article class="card stack" style="gap:8px;${d===t?'border-color:var(--accent)':''}"><div class="row between"><div class="row"><h3>${DAYS[d]}</h3>${d===t?'<span class="pill">Hoy</span>':''}</div>
      ${items.length?`<div class="row"><button class="btn ghost sm" data-a="pd-edit" data-v="${d}">Editar</button><button class="btn primary sm" data-a="pd-start" data-v="${d}">Empezar</button></div>`:`<button class="btn ghost sm" data-a="pd-edit" data-v="${d}">${I.plus.replace('<svg','<svg style="width:16px;height:16px"')} Planificar</button>`}</div>
      ${items.length?`<div class="muted" style="font-size:14px"><b style="color:var(--ink)">${dayMuscles(day)}</b> · ${items.length} ejercicios</div><div class="strip">${items.map(it=>EXI[it.exId]?`<button class="thumbbtn" data-a="info" data-v="${it.exId}" aria-label="Ver ${EXI[it.exId].name}">${demo(it.exId,'thumb')}</button>`:'').join('')}</div>
        <small class="muted">${items.filter(it=>EXI[it.exId]).map(it=>`${EXI[it.exId].name} ${it.sets}×${it.reps}${EXI[it.exId].kind==='time'?'s':''}`).join(' · ')}</small>`:`<div class="muted" style="font-size:14px">Descanso</div>`}</article>`}).join('')}</div>`;
}
function vDayEdit(){
  if(!PD){view='programs';return vPrograms()}
  return `<div class="stack"><div class="row"><button class="mini" data-a="pd-cancel" aria-label="Volver">${I.left}</button><div><div class="eyebrow">Mi semana</div><h1>${DAYS[PD.day]}</h1></div></div>
  <section class="stack" style="gap:8px"><h3>1. ¿Qué músculos entrenas este día?</h3><div class="chips">${MUSCLES.map(m=>`<button class="chip" data-a="pd-mu" data-v="${m.id}" aria-pressed="${PD.muscles.includes(m.id)}">${m.name}</button>`).join('')}</div></section>
  <section class="stack" style="gap:8px"><h3>2. Ejercicios, series y repeticiones</h3>
    ${PD.items.length?`<div class="list">${PD.items.map((it,i)=>{const e=EXI[it.exId];if(!e)return '';return `<div class="item"><button class="thumbbtn" data-a="info" data-v="${it.exId}" aria-label="Ver ${e.name}">${demo(it.exId,'thumb')}</button>
      <div class="grow"><div class="name">${e.name}</div><div class="row" style="gap:6px;margin-top:6px;font-size:13px"><input class="pd-num" inputmode="numeric" data-pd="${i}" data-f="sets" value="${it.sets}" aria-label="Series"> series ×
      <input class="pd-num" inputmode="numeric" data-pd="${i}" data-f="reps" value="${it.reps}" aria-label="${e.kind==='time'?'Segundos':'Repeticiones'}"> ${e.kind==='time'?'seg':'reps'}</div></div>
      <div class="stack" style="gap:4px"><button class="mini" data-a="pd-up" data-v="${i}" aria-label="Subir" ${i?'':'disabled'}>▲</button><button class="mini" data-a="pd-rm" data-v="${i}" aria-label="Quitar ${e.name}">${I.x}</button></div></div>`}).join('')}</div>`
    :`<div class="empty"><p style="margin:0">Todavía no hay ejercicios. Añádelos tú o pulsa “Sugerir” y la app propone dos por cada músculo elegido.</p></div>`}
    <div class="row"><button class="btn ghost" style="flex:1" data-a="pd-add">${I.plus} Añadir</button><button class="btn ghost" style="flex:1" data-a="pd-auto" ${PD.muscles.length?'':'disabled'}>${I.swap} Sugerir</button></div></section>
  <div class="actions"><button class="btn danger" data-a="pd-clear">Dejar de descanso</button><button class="btn primary" style="flex:2" data-a="pd-save">Guardar ${DAYS[PD.day].toLowerCase()}</button></div></div>`;
}
function pdAddSheet(){
  let q='',mf=PD.muscles[0]||'',eqf='';
  const draw=()=>{const list=EX.filter(e=>!PD.items.some(it=>it.exId===e.id)&&(!mf||e.mus.includes(mf))&&(!eqf||e.eq.some(r=>r.split('|').includes(eqf)))&&(!q||e.name.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').includes(q)));
    $('#pdList').innerHTML=list.length?`<div class="list">${list.slice(0,80).map(e=>`<button class="item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%" data-pdadd="${e.id}">${demo(e.id,'thumb')}<div class="grow"><div class="name">${e.name}</div><div class="sub">${e.mus.slice(0,2).map((m,i)=>`<span class="tag ${i?'':'pri'}">${MNAME[m]}</span>`).join('')}<span class="tag">${eqLabel(e)}</span></div></div><span class="mini">${I.plus}</span></button>`).join('')}</div>`:`<p class="muted">No hay ejercicios con estos filtros.</p>`};
  $('#layer').innerHTML=`<div class="overlay" data-a="close-layer"><div class="sheet" role="dialog" aria-modal="true" aria-label="Añadir ejercicio">
    <div class="row between"><h2>Añadir a ${DAYS[PD.day].toLowerCase()}</h2><button class="mini" data-a="close-layer" aria-label="Cerrar">${I.x}</button></div>
    <input class="search" id="pdQ" placeholder="Buscar ejercicio" style="margin-top:12px" autocomplete="off">
    <div class="chips" style="margin-top:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px" id="pdM">${[['','Todos'],...MUSCLES.map(m=>[m.id,m.name])].map(([id,n])=>`<button class="chip" style="flex:none;padding:6px 12px;font-size:14px" data-m="${id}" aria-pressed="${id===mf}">${n}</button>`).join('')}</div>
    <div class="chips" style="margin-top:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px" id="pdE">${[['','Todo el equipo'],...EQUIP.map(q=>[q.id,q.name])].map(([id,n])=>`<button class="chip" style="flex:none;padding:5px 11px;font-size:13px" data-e="${id}" aria-pressed="${id===eqf}">${n}</button>`).join('')}</div>
    <div class="scroll" id="pdList"></div></div></div>`;
  draw();
  $('#pdQ').oninput=e=>{q=e.target.value.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');draw()};
  $('#pdM').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;mf=b.dataset.m;$('#pdM').querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
  $('#pdE').onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;eqf=b.dataset.e;$('#pdE').querySelectorAll('[data-e]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
  $('#pdList').onclick=e=>{const b=e.target.closest('[data-pdadd]');if(!b)return;const ex=EXI[b.dataset.pdadd];PD.items.push({exId:ex.id,sets:3,reps:ex.kind==='time'?30:10});
    ex.mus.slice(0,1).forEach(m=>{if(!PD.muscles.includes(m))PD.muscles.push(m)});render();draw();toast('Añadido: '+ex.name)};
}
function todayCard(){
  if(!A.profile)return '';
  const plan=getPlan(),t=todayIdx(),day=plan.days[t],any=Object.values(plan.days).some(d=>d.items?.length);
  if(day?.items?.length)return `<div class="card row between" style="border-color:var(--accent);margin-bottom:16px"><div style="min-width:0"><div class="eyebrow">Hoy, ${DAYS[t].toLowerCase()}, toca</div><h3 style="margin-top:2px">${dayMuscles(day)}</h3><div class="muted" style="font-size:13px">${day.items.length} ejercicios de tu plan</div></div><button class="btn primary sm" data-a="pd-start" data-v="${t}">Empezar</button></div>`;
  if(any)return `<div class="notice" style="margin-bottom:16px">Hoy es día de descanso en tu plan semanal. Si te apetece entrenar, monta una sesión aquí abajo.</div>`;
  return `<div class="notice row between" style="margin-bottom:16px"><span>Organiza tus entrenos de la semana en <b>Mi semana</b>.</span><button class="btn ghost sm" data-a="go-week">Crear plan</button></div>`;
}

/* ---------- Herramientas ---------- */
const TOOLS=[
 ['rm','Tu peso máximo (1RM)','Calcula cuánto podrías levantar en una sola repetición y qué peso usar en cada serie.','Escribe el peso y las repeticiones de una serie que hayas hecho de verdad, hasta el fallo o casi. Ejemplo: 80 kg × 5 → tu máximo estimado es unos 93 kg. Abajo verás qué peso usar según cuántas repeticiones quieras hacer: para series de 8, usa el 80 %.',I.stats],
 ['plates','Discos para la barra','Dime cuánto quieres levantar y te digo qué discos poner a cada lado.','Escribe el peso total que quieres levantar y el peso de la barra (la olímpica pesa 20 kg). La app calcula los discos que van en cada lado, de mayor a menor. Ejemplo: 100 kg con barra de 20 → 25 + 15 kg en cada lado.',I.train],
 ['interval','Temporizador de intervalos','Cronómetro de trabajo y descanso que pita en cada cambio.','Elige cuántos segundos trabajas, cuántos descansas y cuántas rondas haces, y pulsa Iniciar. El móvil pita al cambiar de fase. Ejemplo Tabata: 20 s de trabajo, 10 s de descanso, 8 rondas.',I.tools],
 ['bmi','Índice de masa corporal (IMC)','Relación entre tu peso y tu altura, con el rango de peso saludable.','Escribe tu altura en centímetros y tu peso en kilos. Te dice tu IMC y qué peso se considera normal para tu altura. Ojo: si tienes mucho músculo puede salir alto sin que sobre grasa.',I.scale],
 ['settings','Ajustes y copia de seguridad','Descanso entre series, tema claro u oscuro y copia de tus datos.','El descanso que elijas aquí es el que arranca automáticamente cada vez que marcas una serie como hecha.',I.shield],
];
function vToolsList(){
  return `<div class="stack"><div><h1>Herramientas</h1><p class="muted" style="margin:6px 0 0">Calculadoras y utilidades para usar en el gimnasio. Toca una para abrirla.</p></div>
  <div class="list">${TOOLS.map(t=>`<button class="item" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%;padding-block:16px" data-a="tool" data-v="${t[0]}"><span class="avatar alt" style="border-radius:12px">${t[4].replace('<svg','<svg style="width:22px;height:22px"')}</span><div class="grow"><div class="name">${t[1]}</div><div class="muted" style="font-size:14px">${t[2]}</div></div>${I.right.replace('<svg','<svg style="width:18px;height:18px;flex:none"')}</button>`).join('')}</div></div>`;
}

/* ---------- Acciones nuevas ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'prog-ex':progressSheet(v);break;
    case 'cal-move':{const n=new Date(),base=calM||new Date(n.getFullYear(),n.getMonth(),1);calM=new Date(base.getFullYear(),base.getMonth()+ +v,1);render();break}
    case 'cal-day':daySheet(v);break;
    case 'repeat-rec':{const r=S.history.find(x=>x.id===v);if(r){closeLayer();startSession(r.name,recItems(r))}break}
    case 'prog-tab':progTab=v;render();break;
    case 'go-week':progTab='week';view='programs';render();window.scrollTo(0,0);break;
    case 'pd-edit':{const d=getPlan().days[v]||{};PD={day:+v,muscles:(d.muscles||[]).slice(),items:(d.items||[]).map(x=>({...x}))};view='dayedit';render();window.scrollTo(0,0);break}
    case 'pd-cancel':PD=null;view='programs';render();break;
    case 'pd-mu':PD.muscles=PD.muscles.includes(v)?PD.muscles.filter(x=>x!==v):[...PD.muscles,v];render();break;
    case 'pd-rm':PD.items.splice(+v,1);render();break;
    case 'pd-up':{const i=+v;if(i>0){[PD.items[i-1],PD.items[i]]=[PD.items[i],PD.items[i-1]];render()}break}
    case 'pd-add':pdAddSheet();break;
    case 'pd-auto':{const have=new Set(PD.items.map(x=>x.exId));let added=0;
      PD.muscles.forEach(m=>{shuffle(EX.filter(x=>x.mus[0]===m&&!have.has(x.id))).slice(0,2).forEach(x=>{have.add(x.id);PD.items.push({exId:x.id,sets:3,reps:x.kind==='time'?30:10});added++})});
      render();toast(added?`Añadidos ${added} ejercicios. Cámbialos si quieres.`:'Ya tienes ejercicios de esos músculos');break}
    case 'pd-clear':confirmBox(`¿${DAYS[PD.day]} de descanso?`,'Se quitarán los ejercicios de este día de tu plan.','Dejar de descanso',async()=>{const plan=getPlan();delete plan.days[PD.day];await savePlan(plan);PD=null;view='programs';render()});break;
    case 'pd-save':{if(!PD.items.length)return toast('Añade al menos un ejercicio o deja el día de descanso');
      const plan=getPlan();plan.days[PD.day]={muscles:PD.muscles,items:PD.items.map(x=>({exId:x.exId,sets:Math.max(1,Math.min(10,parseInt(x.sets,10)||3)),reps:Math.max(1,Math.min(600,parseInt(x.reps,10)||10))}))};
      savePlan(plan);PD=null;view='programs';progTab='week';render();window.scrollTo(0,0);break}
    case 'pd-start':{const d=getPlan().days[v];if(!d)return;startSession(DAYS[v]+' · '+dayMuscles(d),d.items.filter(x=>EXI[x.exId]).map(x=>({exId:x.exId,sets:x.sets,target:x.reps})));break}
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pd!==undefined&&PD){PD.items[+t.dataset.pd][t.dataset.f]=t.value.replace(/\D/g,'')}});

authInit();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
